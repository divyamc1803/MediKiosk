services:
  - type: web
    name: medikiosk-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://medikiosk.vercel.app
      - key: DATABASE_PATH
        value: /var/data/medikiosk.db
    disk:
      name: medikiosk-db
      mountPath: /var/data
      sizeGB: 1
